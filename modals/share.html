<div id="shareModal" class="modal" role="dialog" aria-hidden="true" aria-labelledby="shareTitle">
  <div class="modal-content about-modal">

    <div class="about-head">
      <button type="button" class="about-close" data-action="cerrarShareModal" aria-label="Cerrar">✕</button>
      <div class="about-badge">🔗</div>
      <h2 id="shareTitle">Compartir Cancionero MV</h2>
      <div class="about-meta">Invitá a otros a sumarse</div>
    </div>

    <div class="about-body share-body">

      <!-- HERO IMAGE -->
      <div class="share-hero">
        <img src="imagenes/Cancionero_white.png" alt="Cancionero MV">
      </div>

      <!-- COMPARTIR NATIVO (AirDrop, Mensajes, Mail, Nearby Share, etc.) -->
      <button type="button" class="share-native-btn" data-action="shareNative">
        📤 Compartir
      </button>
      <p class="share-native-hint" id="shareNativeHint">Incluye AirDrop, Mensajes, Mail y todo lo que tengas instalado</p>

      <!-- LINK CARD -->
      <div class="share-card">
        <label>📌 Enlace</label>

        <div class="share-input-group">
          <input id="shareLink"
            type="text"
            value="http://bit.ly/cancionero_mv"
            readonly>

          <button data-action="copyShareLink">📋 Copiar</button>
        </div>
      </div>

      <!-- QR CARD -->
      <div class="share-card qr-card">
        <label class="qr-label">📱 Escanear QR Code con otro dispositivo</label>

        <div class="qr-container">
          <img src="imagenes/qrcode_1.png" class="qr-big">
        </div>
      </div>

    </div>

  </div>
</div>
