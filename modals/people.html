<div id="peopleModal" class="modal" role="dialog" aria-hidden="true" aria-labelledby="peopleModalTitle">
  <div class="modal-content about-modal">

    <div class="about-head">
      <button type="button" class="about-back hidden" id="peopleModalBack" data-action="volverAValoresDesdePeople"></button>
      <button type="button" class="about-close" data-action="cerrarPeopleModal" aria-label="Cerrar">✕</button>
      <div class="about-badge" id="peopleModalBadge">👤</div>
      <h2 id="peopleModalTitle">Listado</h2>
      <div class="about-meta"><span id="peopleModalCount">0</span> canción(es)</div>
    </div>

    <div class="menu-row hidden" id="peopleModalIdiomaRow">
      <span class="sec-icon">🌐</span>
      <span class="menu-row-label">Idioma</span>
      <select id="peopleModalIdioma" class="chord-instrument-select">
        <option value="">Todos</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="gn">Guaraní</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
      </select>
    </div>

    <div class="modal-body-wrap">
      <div id="peopleModalLista" class="about-body biblio-list song-list"></div>
      <div class="modal-letter-rail hidden" id="peopleModalRail"></div>
    </div>

  </div>
</div>
