<!-- ===================== MODAL EQUIVALENCIAS (cantos del libro actual que también están en otros libros) ===================== -->
<div id="equivModal" class="modal" role="dialog" aria-hidden="true" aria-labelledby="equivModalTitle">
  <div class="modal-content about-modal">

    <div class="about-head">
      <button type="button" class="about-back" id="equivModalBack" data-action="volverAInfoDesdeEquiv">← Información de la app</button>
      <button type="button" class="about-close" data-action="cerrarEquivModal" aria-label="Cerrar">✕</button>
      <div class="about-badge">🔗</div>
      <h2 id="equivModalTitle">Equivalencias</h2>
      <div class="about-meta" id="equivModalMeta"></div>
    </div>

    <div class="mini-stats-nav">
      <button type="button" class="alpha-arrow" data-action="scrollTira" data-args="[&quot;equivModalFiltros&quot;,-1]" aria-label="Filtros anteriores">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="about-mini-stats" id="equivModalFiltros"></div>
      <button type="button" class="alpha-arrow" data-action="scrollTira" data-args="[&quot;equivModalFiltros&quot;,1]" aria-label="Filtros siguientes">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <div class="modal-body-wrap">
      <div id="equivModalLista" class="about-body biblio-list song-list"></div>
    </div>

  </div>
</div>
