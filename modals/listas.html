<div id="listasModal" class="modal" role="dialog" aria-hidden="true" aria-labelledby="listasTitle">
  <div class="modal-content about-modal">

    <div class="about-head">
      <button type="button" class="about-close" onclick="cerrarMisListas()" aria-label="Cerrar">✕</button>
      <div class="about-badge">⭐</div>
      <h2 id="listasTitle">Mis Listas</h2>
      <div class="about-meta" id="listasContextLabel">Armá tus propios repertorios</div>
    </div>

    <div class="nueva-lista-row">
      <input id="nuevaListaInput" type="text" placeholder="Nombre de la lista (ej. Retiro enero)" onkeydown="if(event.key==='Enter') crearListaDesdeInput();">
      <button type="button" class="play-btn" onclick="crearListaDesdeInput()">+ Crear</button>
    </div>

    <div class="listas-io-row">
      <button type="button" class="chip" onclick="exportarMisListas()">⬆️ Exportar</button>
      <label class="chip listas-import-btn">
        ⬇️ Importar
        <input type="file" accept=".json,application/json" onchange="importarMisListas(event)" hidden>
      </label>
    </div>
    <p class="listas-io-hint">Para ver las mismas listas en otro navegador o dispositivo: exportá acá y luego importá ese archivo allá.</p>

    <div class="about-body">
      <div id="listasContainer"></div>
    </div>

  </div>
</div>
