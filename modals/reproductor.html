<div id="reproductorModal" class="modal rp-backdrop" role="dialog" aria-hidden="true" aria-label="Mis Playlists">
  <div class="rp-modal">

    <!-- biblioteca / libro / playlist (lo arma js/reproductor.js) -->
    <div id="rpBody" class="rp-body"></div>

    <!-- riel vertical A–Z / números (libro abierto) + burbuja al arrastrar -->
    <div id="rpRiel" class="rp-riel" hidden></div>
    <div id="rpRielBurbuja" class="rp-riel-burbuja" hidden></div>

    <!-- mini reproductor abajo -->
    <div id="rpMini" class="rp-mini" hidden></div>

    <!-- pantalla completa "reproduciendo" (sube desde abajo) -->
    <div id="rpSonando" class="rp-sonando"></div>

    <!-- menú ⋯ (hoja desde abajo) -->
    <div id="rpSheet" class="rp-sheet"></div>

  </div>
</div>

<!-- barrita flotante cuando el reproductor está minimizado (la música sigue) -->
<div id="rpFlotante" class="rp-mini rp-flotante" hidden></div>
